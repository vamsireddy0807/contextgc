[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextgc"
version = "0.0.1"
description = "Dependency-aware context runtime for LLM agents: semantic garbage collection, dependency tracking and causal attribution for context pruning."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sathi Vamsi Krishna Reddy" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/contextgc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
